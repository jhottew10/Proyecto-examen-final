<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto de Encurtido</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    background:#f3eded;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

.card-form{
    width:100%;
    max-width:700px;
    background:#ffffff;
    border-radius:25px;
    padding:40px;
    color:#1f2937;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.titulo{
    text-align:center;
}

.titulo h1{
    font-weight:bold;
    color:#4b5563;
}

.descripcion{
    text-align:center;
    margin:20px 0;
    color:#6b7280;
}

.form-control,
.form-select{
    border-radius:15px;
    padding:12px;
    border:none;
    background:#f3f4f6;
}

.form-control:focus,
.form-select:focus{
    box-shadow:0 0 10px rgba(107,114,128,.4);
}

.btn-ingresar{
    background:#6b7280;
    color:white;
    border:none;
    padding:12px 40px;
    border-radius:15px;
    font-weight:bold;
    transition:.3s;
}

.btn-ingresar:hover{
    background:#4b5563;
    transform:scale(1.03);
}

img{
    width:140px;
    display:block;
    margin:auto;
    border-radius:20px;
}

</style>
</head>
<body>

<div class="card-form">

<img src="https://scontent.fgua2-2.fna.fbcdn.net/v/t39.30808-6/424651367_122122397612149692_8138205512271762017_n.jpg?stp=dst-jpg_tt6&cstp=mx1200x1200&ctp=s1200x1200&_nc_cat=100&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=TZmJXBC2ivQQ7kNvwGZbg_s&_nc_oc=AdoUrZJW7xGE4_yRkjAPp9nDbNCrkTYV94-yM5IS61DDH8UBOJ7IFvrvNPch-x4IM0E613RCr_qbyvJmAL14R8b3&_nc_zt=23&_nc_ht=scontent.fgua2-2.fna&_nc_gid=LcuwXLz-IlJTSlrC2Enuog&_nc_ss=7b2a8&oh=00_Af_UT9kJOXdBZNyE1z2VHDba08ZrjJwYFABhDJ-1ZF-7Gw&oe=6A2BDCE8" alt="logo">

<div class="titulo">
<h1>Proyecto de Biologia</h1>
</div>

<p class="descripcion">
Mermeladas
</p>

<form action="gradosm.html">

<div class="mb-3">
<label class="mb-2">Nombre</label>
<input type="text" class="form-control" required>
</div>

<div class="mb-3">
<label class="mb-2">Edad</label>
<input type="number" class="form-control" required>
</div>

<div class="mb-4">
<label class="mb-2">Grado</label>

<select class="form-select" required>

<option value="">Seleccione su grado</option>

<option>Profesor/a</option>
<option>4to Baco</option>
<option>4to Gastronomía</option>
<option>4to Diseño</option>
<option>4to Biologicas "A"</option>
<option>4to Biologicas "B"</option>
<option>4to Biologicas "C"</option>
<option>4to Perito</option>
<option>4to Turismo</option>
<option>5to Baco "A"</option>
<option>5to Baco "B"</option>
<option>5to Gastronomía</option>
<option>5to Diseño</option>
<option>5to Biológicas "A"</option>
<option>5to Biológicas "B"</option>
<option>5to Perito</option>
<option>5to Turismo</option>
<option>6to Perito</option>
<option>6to Secretariado</option>
<option></option>


</select>

</div>

<div class="text-center">
<button class="btn btn-ingresar">
Ingresar
</button>
</div>

</form>

</div>

</body>
</html>
